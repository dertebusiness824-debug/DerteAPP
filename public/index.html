<!doctype html>
<html lang="es" class="is-booting">
  <head>
    <meta charset="utf-8" />
    <title>DerteApp</title>
    <!-- viewport-fit=cover lets the layout reach under the iPhone home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="DerteApp — reservas, horario y actividad telefónica de tu taller, en el móvil." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Standalone launch on iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DerteApp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@450;550;650;700;800&display=swap" rel="stylesheet" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/app.css?v=92-splash" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Removed once the first screen renders; keeps the cold start from flashing. -->
    <div id="boot" class="boot boot--launch" aria-hidden="true">
      <div class="boot__brand">
        <span class="boot__spin" aria-hidden="true">
          <img class="boot__mark" src="/icons/logo-mark.svg" alt="" width="216" height="216">
        </span>
        <span class="boot__wordmark">derteapp</span>
      </div>
      <noscript>DerteApp necesita JavaScript activado.</noscript>
    </div>

    <script type="module" src="/js/app.js?v=46-splash"></script>
  </body>
</html>
