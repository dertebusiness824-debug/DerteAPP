<!doctype html>
<html lang="es" class="is-booting">
  <head>
    <meta charset="utf-8" />
    <title>DerteApp</title>
    <!-- viewport-fit=cover lets the layout reach under the iPhone home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="DerteApp — reservas, horario y actividad telefónica de tu taller, en el móvil." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Standalone launch on iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DerteApp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@450;550;650;700;800&display=swap" rel="stylesheet" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/app.css?v=100-emoji" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Removed once the first screen renders; keeps the cold start from flashing. -->
    <div id="boot" class="boot boot--launch" aria-hidden="true">
      <div class="boot__brand">
        <span class="boot__glyph" aria-hidden="true">
          <span class="boot__ring"></span>
          <span class="boot__glow"></span>
          <span class="boot__tools">
            <!-- 🛠️ silhouettes: claw hammer (\) behind, crescent wrench (/) in front. -->
            <svg class="boot__tool boot__tool--hammer" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M29.2 16h5.6v41.2a2.8 2.8 0 0 1-5.6 0zM32 54.8a2.15 2.15 0 1 0 .01 0z"/>
              <path d="M26.6 7.4v13.6H12.4a6.8 6.8 0 0 1 0-13.6z"/>
              <path d="M26.6 7.4h11.4c8.6.3 16.2 8.8 19.8 21.2l-6.6 2.2C48 20.2 42.2 14.6 37.2 14.4H26.6z"/>
            </svg>
            <svg class="boot__tool boot__tool--wrench" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
              <path d="M20.3 7.95A16.5 13.5 0 1 1 43.7 7.95L37.8 12.8A8.2 6.6 0 1 0 26.2 12.8Z"/>
              <path fill-rule="evenodd" d="M29.2 28.8h5.6v28.6a2.8 2.8 0 0 1-5.6 0zM32 54.9a2.15 2.15 0 1 0 .01 0z"/>
            </svg>
          </span>
          <span class="boot__spin">
            <img class="boot__mark" src="/icons/logo-mark.svg" alt="" width="216" height="216">
          </span>
        </span>
        <span class="boot__wordmark">derteapp</span>
      </div>
      <noscript>DerteApp necesita JavaScript activado.</noscript>
    </div>

    <script type="module" src="/js/app.js?v=54-emoji"></script>
  </body>
</html>
