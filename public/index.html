<!doctype html>
<html lang="es" class="is-booting">
  <head>
    <meta charset="utf-8" />
    <title>DerteApp</title>
    <!-- viewport-fit=cover lets the layout reach under the iPhone home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="DerteApp — reservas, horario y actividad telefónica de tu taller, en el móvil." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Standalone launch on iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DerteApp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@450;550;650;700;800&display=swap" rel="stylesheet" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/app.css?v=101-lockup" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Removed once the first screen renders; keeps the cold start from flashing. -->
    <div id="boot" class="boot boot--launch" aria-hidden="true">
      <div class="boot__brand">
        <span class="boot__glyph" aria-hidden="true">
          <span class="boot__ring"></span>
          <span class="boot__glow"></span>
          <span class="boot__tools">
            <svg class="boot__tool boot__tool--wrench" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
            <svg class="boot__tool boot__tool--hammer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.6 5.1h13.2v4.2H3.6z"/>
              <path d="M16.8 5.1 20.4 3.8v6.8L16.8 9.3"/>
              <path d="M10.2 9.3V21"/>
            </svg>
          </span>
          <span class="boot__spin">
            <img class="boot__mark" src="/icons/logo-mark.svg" alt="" width="216" height="216">
          </span>
        </span>
        <span class="boot__wordmark">derteapp</span>
      </div>
      <noscript>DerteApp necesita JavaScript activado.</noscript>
    </div>

    <script type="module" src="/js/app.js?v=55-lockup"></script>
  </body>
</html>
