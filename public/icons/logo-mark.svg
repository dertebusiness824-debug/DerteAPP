<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="derteapp">
  <!-- Interlocking diagonal arrow-links (white), transparent background -->
  <g stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lower-left → upper-right link with arrowhead -->
    <path d="M14 42c0-10 8-18 18-18h10"/>
    <path d="M36 18l10 6-6 10"/>
    <!-- Upper-right → lower-left link with arrowhead (passes through) -->
    <path d="M50 22c0 10-8 18-18 18H22"/>
    <path d="M28 46l-10-6 6-10"/>
  </g>
</svg>
