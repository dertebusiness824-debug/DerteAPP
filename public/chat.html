<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chat with your garage · DerteApp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Chat with your auto repair shop about your booking." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d0f" media="(prefers-color-scheme: dark)" />
    <!-- A private conversation link should never be indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />

    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" class="boot">
      <img src="/icons/icon-192.png" alt="" width="56" height="56" />
      <span class="boot__name">Opening your chat</span>
      <span class="boot__spinner" aria-hidden="true"></span>
      <noscript>This chat needs JavaScript enabled. You can also call the shop directly.</noscript>
    </div>

    <script type="module" src="/js/customer-chat.js"></script>
  </body>
</html>
